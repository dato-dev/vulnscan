# Бот-форма обратной связи на отдельном сервере.
#
# Сканер здесь не поднимается: он в Kubernetes, бот ходит к нему по HTTPS
# через Gateway API. Входящих портов нет — ни вебхука Telegram, ни коллбэка
# сканера: обновления забираются long polling, вердикт — опросом.
#
#   cp .env.example .env   # заполнить
#   docker compose up -d
#   docker compose logs -f

services:
  feedbackbot:
    # Тег — явно, а не `latest`: иначе на сервере работает то, что было
    # последним на момент первого `pull`, а не то, что вы собрали сейчас.
    image: ${FEEDBACKBOT_IMAGE:?задайте FEEDBACKBOT_IMAGE в .env, например dato1/vulnscantg-feedbackbot:v1.0.0}
    restart: unless-stopped
    env_file: .env
    environment:
      # Путь фиксирован и совпадает с точкой монтирования ниже.
      SCANNER_CA_FILE: /etc/feedbackbot/ca.crt
    volumes:
      # Сертификат своего центра, если TLS на входе в кластер выпущен не
      # публичным. Не задан — сюда монтируется /dev/null, и бот доверяет
      # системным центрам.
      - ${SCANNER_CA_FILE_ON_HOST:-/dev/null}:/etc/feedbackbot/ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Файл держится в памяти целиком, по одному на проверку. Четыре проверки
    # по 20 МБ плюс интерпретатор — с запасом.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
