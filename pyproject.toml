[project]
name = "vulnscantg"
version = "2.0.0"
description = "CDR и детект вредоносного содержимого во вложениях чат-бота"
requires-python = ">=3.12"

# Пусто намеренно. Здесь были бы зависимости «проекта», но проекта как одного
# устанавливаемого пакета нет: это шесть сервисов, у каждого свой образ.
#
# Список общих зависимостей означал бы, что gateway тащит pikepdf, pillow и
# yara-python — три библиотеки на C, разбирающие недоверенный ввод, в образ,
# который ничего не разбирает. Для сервиса, где каждый парсер считается новой
# поверхностью атаки, это не мелочь.
#
# Поэтому состав каждого образа лежит в своей группе ниже, а `uv.lock`
# закрепляет версии сразу для всех.
dependencies = []

[dependency-groups]
# Группы соответствуют образам один к одному. Dockerfile ставит СВОЮ группу и
# ничего сверх неё: `uv export --no-default-groups --group gateway`.
#
# Версии здесь через `>=`, а закрепляет их `uv.lock` — он и есть ответ на
# вопрос «что именно стоит в образе». Исключение — SDK наблюдаемости: у них
# точные версии прямо здесь, см. группу `telemetry`.

gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
]

worker = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "boto3>=1.35",
    # Разбор недоверенного контента. Живут только здесь: воркер — единственный,
    # у кого нет сетевого выхода наружу.
    "pikepdf>=9.4",
    "pillow>=11.0",
    "clamd>=1.0.2",
    "yara-python>=4.5",
    "python-magic>=0.4.27",
]

bot = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

# Бот-форма обратной связи. Ставится на отдельный сервер, к сканеру ходит
# через `vulnscan_client` (ему нужен только httpx), в S3 пишет карточки.
feedbackbot = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "boto3>=1.35",
]

writer = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    # История проверок. Доступ к базе есть только у этого сервиса.
    "asyncpg>=0.30",
]

notifier = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    # Читает обезвреженную копию из нашего хранилища и кладёт её в чужое
    # (M14.1). Забыли эту строку — образ собрался, а сервис упал на
    # `ModuleNotFoundError` при старте: далеко от причины и только в бою.
    "boto3>=1.35",
]

# Сайт документации на GitHub Pages. Собирается только в CI и локально, в
# образы не едет.
docs = [
    "mkdocs-material>=9.5",
    # MkDocs 2.0 ломает темы и плагины без пути миграции (предупреждение
    # самой Material). Переход — отдельным решением, не очередным `uv lock`.
    "mkdocs>=1.6,<2",
]

demo-site = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
]

# Зеркало баз ClamAV. Общего кода не тянет вовсе — только чужую утилиту.
cvdmirror = ["cvdupdate>=1.1"]

# Клиент Prometheus. Отдельно от трассировки, потому что метрики отдают все
# образы, включая те, где OTel ни при чём: зеркало баз и пример подключения.
#
# Версия ТОЧНАЯ и одна на все образы. Разъехавшиеся версии клиента дают разный
# формат экспозиции, и расхождение проявится не ошибкой, а тем, что Prometheus
# перестанет разбирать часть рядов.
metrics = ["prometheus-client==0.26.0"]

# Трассировка. Сервис обязан работать и без неё: отсутствующий SDK выключает
# телеметрию, но не проверку файлов.
#
# Версии точные, а не `>=`, хотя рядом есть `uv.lock`. Причина не в
# воспроизводимости — её обеспечивает лок, — а в том, что обновление этих
# библиотек должно быть отдельным осознанным действием: расхождение версий
# телеметрии проявляется не ошибкой, а молча изменившимися именами атрибутов.
# Точная версия здесь заставляет править эту строку руками.
telemetry = [
    { include-group = "metrics" },
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

# Локальная работа: прогон тестов требует зависимостей ВСЕХ сервисов —
# `tests/conftest.py` кладёт их пакеты в `sys.path` и импортирует в одном
# процессе.
dev = [
    { include-group = "gateway" },
    { include-group = "worker" },
    { include-group = "bot" },
    { include-group = "writer" },
    { include-group = "notifier" },
    { include-group = "feedbackbot" },
    { include-group = "demo-site" },
    { include-group = "docs" },
    { include-group = "telemetry" },
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.7",
    "mypy>=1.13",
    # Читают тесты дашбордов, конвейера CI и compose. Раньше приезжал
    # транзитивно через uvicorn[standard] — то есть держался на чужом решении,
    # которое могло измениться в любой момент.
    "pyyaml>=6.0",
]

[tool.uv]
# Сам проект не устанавливается: код едет в образы копированием каталогов, а
# локально его находит `sys.path` из `tests/conftest.py`. Без этой строки
# `uv sync` пытался бы собрать и поставить `vulnscantg` как пакет.
package = false

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
# Внешний генератор тестового корпуса: не наш стиль, не форматируем.
extend-exclude = ["badpdfgen"]
target-version = "py312"
src = [
    "packages",
    "services/gateway",
    "services/worker",
    "examples/telegram-bot",
    "services/writer",
    "services/notifier",
    "examples/feedbackbot",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF", "T20"]
ignore = [
    "S101",             # assert разрешён в тестах
    "RUF001", "RUF002", "RUF003",  # кириллица в строках, докстрингах и комментариях
    "B008",             # Depends()/File() в дефолтах — идиома FastAPI
    "S104",             # bind 0.0.0.0 внутри контейнера — норма
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"samples/*" = ["T20"]
"bench/*" = ["T20", "E402"]
"docs/*" = ["T20", "E402"]
# Генератор дашбордов: его вывод — путь записанного файла, а не лог сервиса.
"deploy/grafana/*" = ["T20"]
# Шлюз выкатки правил: его вывод — отчёт оператору, а не лог сервиса.
"rules/*" = ["T20"]
# Инструменты оператора: их вывод и есть результат работы, а адрес сервиса
# задаёт человек в командной строке.
"deploy/vsask.py" = ["T20", "S310"]
# Настройка конфигурации: диалог с оператором в консоли и есть её работа.
"deploy/configure.py" = ["T20"]
"corpus/*" = ["T20", "E402", "S310"]  # печать отчёта и загрузка по фиксированному URL   # печать результатов и импорт после sys.path
"packages/vscommon/config.py" = ["S105"]
"examples/telegram-bot/botapp/config.py" = ["S105"]  # дефолт-заглушка, значение из env   # дефолты-заглушки, реальные значения из env
"services/worker/worker_app/config.py" = ["S108"] # /dev/shm — намеренный tmpfs, не /tmp
# Отчёт для оператора, а не цикл сервиса: его вывод и есть результат работы.
# Запрет на print защищает горячий путь от записи мимо структурных логов —
# к разовому запуску из консоли это не относится.
"services/writer/writerapp/usage.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages:services/gateway:services/worker"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Интеграционные тесты требуют поднятых Redis и PostgreSQL, поэтому в обычный
# прогон не входят: `make test` обязан работать без Docker и без сети.
#   make test-integration — запустить их отдельно
addopts = "--ignore=tests/integration --ignore=tests/e2e"
markers = [
    "integration: требует настоящих Redis и PostgreSQL",
    "e2e: требует поднятого стенда tests/e2e (весь стек и настоящее S3)",
]
filterwarnings = [
    # Строгий режим: предупреждение ломает прогон. Иначе настоящие тонут в шуме,
    # а среди них бывают DeprecationWarning от библиотек, разбирающих
    # недоверенный контент, — эти пропускать нельзя.
    "error",
    # Сэмплы с аннотациями формы намеренно собраны так, чтобы виджеты были
    # недостижимы из /AcroForm: на таких документах и проверяется разбор.
    # Подавляем ровно этот класс от ровно этого модуля.
    "ignore::pikepdf._methods.PageCopyWarning",
    # Чужое устаревание: starlette просит httpx2. Обновление тянет смену
    # HTTP-клиента во всех сервисах — отдельная задача, а не тихий апгрейд
    # посреди работы над долгами.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Тоже чужое: starlette обращается к устаревшему псевдониму anyio. Всплыло
    # при переходе на uv.lock — прежнее окружение собиралось однажды и с тех
    # пор не пересчитывалось, то есть тесты и образы месяцами шли на разных
    # версиях библиотек, и никто об этом не знал. Ровно ради этого лок и нужен.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
    # Незакрытые сокеты fakeredis в тестовых фикстурах. Это гигиена тестов, а
    # не утечка в сервисе: предупреждение всплывает при сборке мусора от
    # предыдущего теста. Разбирается отдельно (D4), глушить продуктовые
    # ResourceWarning этим не хочется — но и городить закрытие в двадцати
    # местах посреди работы над долгами тоже.
    "ignore::ResourceWarning",
]
asyncio_mode = "auto"
