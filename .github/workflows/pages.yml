# Сайт документации на GitHub Pages.
#
# Документация живёт рядом с кодом (README сервиса — у сервиса), сайт
# собирается из неё здесь: `docs/pages.py` раскладывает `.md` по одному
# каталогу, `mkdocs build --strict` превращает в сайт.
#
# `--strict` — ради того, чтобы битая ссылка роняла сборку, а не жила на
# сайте. Первый же прогон нашёл такую в `docs/api.md`: ссылка на пример
# политик вела на файл, которого нет с момента переезда конфигурации.
#
# Выкладка — только из основной ветки. Сборка на PR идёт тоже, но без
# публикации: так битая ссылка видна до мержа.
#
# До первого запуска в настройках репозитория: Settings → Pages →
# Source: GitHub Actions.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "docs/pages.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "docs/pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Одна выкладка за раз; новая отменяет незаконченную старую — на сайте нужна
# последняя версия документации, а не каждая промежуточная.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          # Та же версия, что в остальных конвейерах и в Dockerfile.
          version: "0.11.25"

      - name: Окружение
        # Только группа документации: сайту не нужны ни парсеры воркера, ни
        # yara-python, который собирается не везде.
        run: uv sync --frozen --no-default-groups --group docs

      - name: Собрать сайт
        run: |
          .venv/bin/python docs/pages.py
          .venv/bin/mkdocs build --strict

      - name: Отдать сборку на выкладку
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
