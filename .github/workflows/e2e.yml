# Сквозной прогон доставки (ROADMAP M13.0).
#
# Зачем. Путь «файл принят → проверен → пересобран → выгружен в чужое
# хранилище» ни разу не выполнялся целиком: в обычных тестах `boto3` подменён,
# и заглушка проверяет наши представления о нём, а не работу. За неделю на этом
# пути нашлись подряд отсутствующая зависимость в образе, политика с неверным
# именем, ссылка на несуществующую учётку и поле, которого нет в выкаченном
# образе. Симптом каждый раз был один: сервис работает, файлы не приходят.
#
# Почему на своём раннере. Прогон поднимает пять контейнеров и собирает образы
# из дерева — на раннерах GitHub это минуты и мегабайты на каждый запуск. Плюс
# сборка тянет `ghcr.io` и Docker Hub, а на своём раннере кэш слоёв между
# прогонами живёт.
#
# ВАЖНО, про self-hosted. У этого конвейера нет и не должно быть триггера
# `pull_request`: на своём раннере он означал бы выполнение кода из чужого
# форка на вашем железе. `pull_request_target` — то же самое, но хуже. Только
# push в основную ветку, расписание и ручной запуск — всё с кодом из ветки.

name: e2e

on:
  push:
    branches: [main]
    # Пути, правка которых способна сломать доставку. Не весь репозиторий:
    # прогон долгий, и запускать его на правку README значит приучить всех
    # его игнорировать.
    paths:
      - "packages/vscommon/**"
      - "services/**"
      - "tests/e2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/e2e.yml"
      - "deploy/k8s/base/**"

  schedule:
    # Раз в сутки. Прогон ловит не только свои изменения: базовые образы,
    # MinIO и зависимости меняются сами, и отказ от этого выглядит так же —
    # файлы перестают приходить.
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: read

# Стенд занимает фиксированные порты (18080, 19000). Два прогона одновременно
# подрались бы за них, и второй падал бы на «port is already allocated» —
# отказ, не имеющий отношения к проверяемому коду.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  kubernetes:
    # Выкат — после зелёного сквозного прогона, а не параллельно с ним:
    # иначе в кластер уезжает то, что прогон через минуту признает сломанным.
    needs: delivery
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 30
    env:
      # Версия закреплена: `stable.txt` менял бы клиент от прогона к прогону.
      # Держите её в пределах одной минорной версии от кластера.
      KUBECTL_VERSION: ${{ vars.KUBECTL_VERSION || 'v1.33.9' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Без checkout в рабочем каталоге нет `deploy/k8s/base`.
          persist-credentials: false

      - name: Проверить есть ли kubectl на ноде
        # Ставим в каталог раннера, а не в /usr/bin: sudo раннеру не нужен, и
        # давать его ради одного бинарника — лишнее. Сумма сверяется с
        # опубликованной рядом: скачанный без проверки бинарник получает
        # kubeconfig с правами на кластер.
        run: |
          set -eu
          if ! command -v kubectl >/dev/null 2>&1; then
            dir="$RUNNER_TOOL_CACHE/kubectl/$KUBECTL_VERSION"
            mkdir -p "$dir"
            base="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64"
            curl -fsSL -o "$dir/kubectl" "$base/kubectl"
            echo "$(curl -fsSL "$base/kubectl.sha256")  $dir/kubectl" | sha256sum --check
            chmod +x "$dir/kubectl"
            echo "$dir" >> "$GITHUB_PATH"
          fi

      - name: Авторизоваться в кластере
        # `export` в отдельном шаге до следующего не доживает: каждый шаг —
        # новый процесс. Переменная передаётся через GITHUB_ENV, а сам
        # kubeconfig — из секрета во временный файл, который удаляется в конце.
        env:
          KUBECONFIG_DATA: ${{ secrets.E2E_KUBECONFIG }}
        run: |
          set -eu
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::не задан secrets.E2E_KUBECONFIG"
            exit 1
          fi
          umask 077
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Проверить остался ли namespace от прошлого деплоя
        # Namespace НЕ удаляется. В нём живут секреты, которых нет в
        # репозитории (`deploy/k8s/secrets.sh` собирает их из локальных
        # файлов), и тома с историей проверок и базами антивируса. После
        # удаления выкат поднял бы поды без ключей, а данные ушли бы безвозвратно.
        # `apply -k` идемпотентен: существующее обновится, новое создастся.
        run: |
          if kubectl get namespace vulnscan >/dev/null 2>&1; then
            echo "namespace vulnscan есть — обновляем"
          else
            echo "namespace vulnscan нет — первая установка; секреты создайте вручную: sh deploy/k8s/secrets.sh"
          fi

      - name: Задеплоить vulnscan
        # `-k`, а не `-f`: `-f` по каталогу применил бы и secrets.example.yaml —
        # заглушки поверх настоящих секретов — и споткнулся бы о
        # kustomization.yaml, который не объект Kubernetes.
        run: kubectl apply -k deploy/k8s/base

      - name: Проверить, что все ок
        # `apply` готовности не ждёт: он возвращается, как только объекты
        # приняты. Ждём каждый Deployment и StatefulSet. clamd поднимается
        # долго — у него своя проба запуска на базы.
        run: |
          set -eu
          for resource in $(kubectl -n vulnscan get deployment,statefulset -o name); do
            kubectl -n vulnscan rollout status "$resource" --timeout=600s
          done
          kubectl -n vulnscan get pods -o wide

      - name: Состояние кластера при сбое
        if: failure()
        run: |
          kubectl -n vulnscan get pods -o wide || true
          kubectl -n vulnscan get events --sort-by=.lastTimestamp | tail -40 || true

      - name: Убрать kubeconfig
        # Раннер свой и живёт долго: файл с доступом к кластеру не должен
        # дожидаться следующего прогона.
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"

  delivery:
    # ЗАМЕНИТЕ на метки своего раннера, как в security.yml.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # Раннер свой и живёт долго: без этого токен останется лежать в
          # .git/config рабочего каталога до следующего запуска.
          persist-credentials: false

      - name: Проверить доступ к Docker
        # Отдельным шагом и первым. Без него прогон падает на `up` строкой
        # «permission denied ... docker.sock», в которой не сказано ни кто
        # запущен, ни чего не хватает, — и разбор начинается с гадания.
        #
        # Учётку раннера в workflow не выбрать: он работает от пользователя,
        # под которым запущен его сервис. Нужны разные — поднимайте два
        # раннера с разными метками и выбирайте меткой в `runs-on`.
        run: |
          set -eu
          if docker info >/dev/null 2>&1; then
            echo "docker доступен пользователю $(id -un)"
            exit 0
          fi
          echo "::error::раннер работает от $(id -un), и доступа к docker.sock у него нет."
          echo "Группы пользователя: $(id -Gn)"
          echo
          echo "Починка на хосте раннера:"
          echo "  sudo usermod -aG docker $(id -un)"
          echo "  sudo systemctl restart actions.runner.*"
          echo
          echo "ВАЖНО: членство в группе docker равносильно root — сокет позволяет"
          echo "смонтировать корень хоста в контейнер. Раннер после этого стоит"
          echo "считать привилегированным и не пускать на него чужой код."
          exit 1

      - name: Поставить uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Та же версия, что в остальных конвейерах и в Dockerfile.
          version: "0.11.25"

      - name: Окружение
        # Из того же лока, что и образы. Тесту нужны pytest и boto3 — вторым
        # он читает приёмник, но уже АДМИНСКОЙ учёткой: у сервиса своя, с
        # правами только на запись, и подменять одну другой нельзя.
        run: uv sync --frozen --all-groups

      - name: Настроить стенд
        # Ключи, политика и учётные данные приёмника генерируются: в
        # репозитории их нет, `.gitignore` исключает `keys.json` и всё с
        # `secret` в пути. Первый прогон на раннере упал именно поэтому —
        # локально файлы были, в CI их не оказалось.
        run: .venv/bin/python tests/e2e/configure_stand.py

      - name: Поднять стенд
        # `--build` обязателен: прогон по опубликованному тегу воспроизводил
        # бы расхождение кода и образа вместе с ошибкой, а половина найденного
        # была именно им.
        run: docker compose -f tests/e2e/docker-compose.yml up -d --build --wait

      - name: Сэмплы
        run: .venv/bin/python samples/make_samples.py

      - name: Готовность стенда
        # Ответ /readyz печатается до прогона. Первый запуск пропустил все
        # тесты, и понять почему было нельзя: в логе не осталось ни ответа
        # сервиса, ни причины пропуска.
        run: curl -sS -i http://localhost:18080/readyz | head -20

      - name: Прогон
        env:
          # Стенд только что подняли: пропуск здесь означал бы зелёную задачу,
          # ничего не проверившую. Ровно это и случилось на первом прогоне —
          # восемь тестов пропущены, доставка не проверена, галочка стоит.
          E2E_REQUIRE_STAND: "1"
        run: .venv/bin/python -m pytest tests/e2e -v -p no:cacheprovider

      - name: Логи стенда при сбое
        # Ради разбора: падение сквозного теста почти никогда не объясняется
        # самим тестом — причина в логах одного из пяти контейнеров.
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.yml logs --tail 200

      - name: Погасить стенд
        # Всегда, включая отмену прогона: контейнеры переживают задачу и
        # достанутся следующей, а порты останутся занятыми.
        #
        # Тома НЕ сносим (`down` без `-v`): в `clamav-db` лежат антивирусные
        # базы, и удаление превращало бы каждый прогон в получасовую закачку.
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down

  # Отдельная задача, а не шаг предыдущей. MinIO проверяет нашу логику,
  # настоящий Yandex Object Storage — совместимость: подпись, регион,
  # поведение при отказе в правах. Разделены потому, что причины отказа разные:
  # красная задача `delivery` означает «сломан код», красная `yandex` —
  # «сломан код ИЛИ внешний сервис недоступен». Слив их в одну, мы получили бы
  # сборку, красноту которой объясняют погодой.
  yandex:
    # Только по расписанию и вручную: на каждый push ходить во внешнее
    # хранилище незачем, а флапающая проверка приучает игнорировать красное.
    if: github.event_name != 'push'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Проверить, что приёмник настроен
        # Без секретов задача не падает, а сообщает, чего не хватает. Красный
        # прогон из-за незаполненного секрета читался бы как поломка сервиса.
        id: ready
        env:
          BUCKET: ${{ vars.E2E_SINK_BUCKET }}
          ACCESS: ${{ secrets.E2E_SINK_ACCESS_KEY }}
        run: |
          set -eu
          if [ -z "${BUCKET:-}" ] || [ -z "${ACCESS:-}" ]; then
            echo "::notice::прогон против Yandex пропущен: не заданы vars.E2E_SINK_BUCKET и secrets.E2E_SINK_*"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Проверить доступ к Docker
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -eu
          docker info >/dev/null 2>&1 && exit 0
          echo "::error::раннер работает от $(id -un) и не имеет доступа к docker.sock."
          echo "  sudo usermod -aG docker $(id -un) && sudo systemctl restart actions.runner.*"
          exit 1

      - name: Поставить uv
        if: steps.ready.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.25"

      - name: Окружение
        if: steps.ready.outputs.ready == 'true'
        run: uv sync --frozen --all-groups

      - name: Настроить приёмник
        if: steps.ready.outputs.ready == 'true'
        env:
          E2E_SINK_ENDPOINT: https://storage.yandexcloud.net
          E2E_SINK_BUCKET: ${{ vars.E2E_SINK_BUCKET }}
          E2E_SINK_REGION: ru-central1
          E2E_SINK_ACCESS_KEY: ${{ secrets.E2E_SINK_ACCESS_KEY }}
          E2E_SINK_SECRET_KEY: ${{ secrets.E2E_SINK_SECRET_KEY }}
          # Свой префикс на прогон. Учётка сервиса умеет только писать и за
          # собой не убирает — уборку в бакете делает правило жизненного цикла,
          # а не тест. Без разделения прогоны видели бы объекты друг друга и
          # проходили по чужим файлам.
          E2E_SINK_PREFIX: e2e/${{ github.run_id }}/
        run: .venv/bin/python tests/e2e/configure_stand.py

      - name: Поднять стенд
        if: steps.ready.outputs.ready == 'true'
        run: docker compose -f tests/e2e/docker-compose.yml up -d --build --wait

      - name: Сэмплы
        if: steps.ready.outputs.ready == 'true'
        run: .venv/bin/python samples/make_samples.py

      - name: Прогон
        if: steps.ready.outputs.ready == 'true'
        env:
          E2E_SINK_ENDPOINT: https://storage.yandexcloud.net
          E2E_SINK_BUCKET: ${{ vars.E2E_SINK_BUCKET }}
          E2E_SINK_REGION: ru-central1
          E2E_SINK_PREFIX: e2e/${{ github.run_id }}/
          E2E_SINK_ACCESS_KEY: ${{ secrets.E2E_SINK_ACCESS_KEY }}
          E2E_SINK_SECRET_KEY: ${{ secrets.E2E_SINK_SECRET_KEY }}
          # Читает приёмник ОТДЕЛЬНАЯ учётка: у сервиса права только на запись,
          # и подменять их админскими значило бы проверять не то, что поедет.
          E2E_READER_ACCESS_KEY: ${{ secrets.E2E_READER_ACCESS_KEY }}
          E2E_READER_SECRET_KEY: ${{ secrets.E2E_READER_SECRET_KEY }}
          E2E_REQUIRE_STAND: "1"
        run: .venv/bin/python -m pytest tests/e2e -v -p no:cacheprovider

      - name: Логи стенда при сбое
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.yml logs --tail 200

      - name: Погасить стенд
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down
