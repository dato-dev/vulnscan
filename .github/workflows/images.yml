# Еженедельная проверка ОБРАЗОВ с заливкой в DefectDojo.
#
# Что здесь и чего здесь нет. Код — исходники, SAST, секреты, зависимости,
# Dockerfile, SBOM — ушёл в общий пайплайн (`security.yml`), он гоняется на
# каждый push. Тут остался предмет, которого общий пайплайн не касается:
# опубликованный образ по тегу. Это не тот же код под другим углом — это
# базовый образ, системные пакеты и всё, что приехало вместе с ними.
#
# Зачем отдельный конвейер и почему на своём раннере. DefectDojo живёт во
# внутренней сети и снаружи недоступен, поэтому заливать в него с раннеров
# GitHub нечем. Плюс сама проверка бессмысленна разово: уязвимость появляется
# не в момент коммита, а когда её опубликовали, — образ, вчера чистый, сегодня
# уязвим при том же дайджесте. Поэтому расписание, а не триггер на изменение.
#
# ВАЖНО, про self-hosted. У этого конвейера нет и не должно быть триггера
# `pull_request`. На своём раннере он означал бы выполнение кода из чужого
# форка на вашем железе, внутри вашей сети, рядом с токеном DefectDojo и
# доступом к реестру. `pull_request_target` — то же самое, но хуже.
# Только расписание и ручной запуск, оба — с кодом из основной ветки.

name: images

on:
  schedule:
    # Понедельник, 06:00 UTC. GitHub отключает расписание в репозитории, где
    # 60 дней не было активности, и молча: конвейер просто перестаёт идти.
    # Если работа над репозиторием замирает, проверьте это первым делом.
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образов для проверки"
        default: "latest"
        type: string
      targets:
        description: "Цели через пробел; пусто — все (образы, repo, sast)"
        default: ""
        type: string

# Токен конвейеру нужен только на чтение своего же кода. Заливка идёт в
# DefectDojo по своему токену, к GitHub API конвейер не обращается.
permissions:
  contents: read

# Прогон длинный. Второй, наехавший на первый, дал бы две пачки находок с
# одинаковым временем и гонку в reimport по одному и тому же тесту.
concurrency:
  group: security
  cancel-in-progress: false

jobs:
  scan:
    # ЗАМЕНИТЕ на метки своего раннера. Отдельная метка (не голое self-hosted)
    # стоит того: этот конвейер получает токен DefectDojo и доступ к реестру,
    # и не должен случайно уехать на раннер, поднятый для чего-то другого.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          # Раннер свой и живёт долго: без этого токен останется лежать в
          # .git/config рабочего каталога до следующего запуска.
          persist-credentials: false
          # Вся история, а не последний коммит (умолчание checkout — глубина
          # 1). Ради gitleaks: секрет, добавленный и удалённый следующим
          # коммитом, из рабочего дерева пропадает, а из истории нет. С
          # глубиной 1 проверять было бы нечего, и отчёт приходил бы пустым —
          # то есть отказ выглядел бы как «секретов не найдено».
          fetch-depth: 0

      - name: Поставить uv
        # Полная версия, а не мажорная: astral-sh перестали двигать
        # скользящие теги после v7, и `@v10` не существует — конвейер падает
        # на этапе разрешения экшенов, до единого шага.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Та же версия, что в rules.yml и в Dockerfile. Нужен ради uvx:
          # bandit и semgrep запускаются им, в uv.lock их нет и не надо.
          version: "0.11.25"

      - name: Поставить trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          # Версия сканера влияет на состав находок ровно так же, как версия
          # правил. Пусть меняется отдельным осознанным коммитом, а не сама.
          version: v0.74.0

      - name: Поставить gitleaks
        env:
          # Пин по той же причине, что trivy: набор правил детекта меняется
          # с версией, и плавающая даст скачок в отчёте на ровном месте.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/$file"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Бинарник из интернета, который сейчас получит доступ ко всей
          # истории репозитория, проверяется по контрольной сумме. Без этого
          # security-конвейер сам оказывается местом, куда удобно подложить
          # чужой код.
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$file" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 755 gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Проверки и заливка в DefectDojo
        env:
          # Переменная, а не секрет: секреты GitHub маскирует в логах, и
          # адрес в выводе стал бы `***` — разбирать по нему, куда ушла
          # заливка, невозможно. Секретность здесь и не нужна: хост виден
          # любому, у кого есть доступ к этому приватному репозиторию.
          DD_URL: ${{ vars.DD_URL }}
          DD_TOKEN: ${{ secrets.DD_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
          # Учётных данных реестра здесь нет: образы dato1/vulnscantg-* на
          # Docker Hub публичные, trivy тянет их анонимно. Если реестр станет
          # приватным — добавьте TRIVY_USERNAME и TRIVY_PASSWORD из секретов,
          # но не `docker login`: тот пишет их в ~/.docker/config.json
          # раннера, где они переживут прогон и достанутся следующей задаче.
          # Отчёты кладём в рабочий каталог, чтобы приложить их к разбору,
          # если что-то упадёт.
          DD_REPORT_DIR: ${{ github.workspace }}/.security-reports
          # Через окружение, а не подстановкой в `run`. Значение приходит из
          # формы ручного запуска, а ${{ }} подставляется в строку команды до
          # того, как её увидит shell: любой символ оттуда стал бы частью
          # команды. Здесь это лишь слово, которое shell разобьёт по пробелам.
          #
          # Только образы. Исходники, SAST, секреты и зависимости ушли в общий
          # пайплайн (`security.yml`) — он гоняется на каждый push. Здесь
          # остаётся то, чего общий пайплайн не умеет и уметь не должен:
          # проверка ОПУБЛИКОВАННОГО образа по тегу. Предмет другой — не код,
          # который вы написали, а то, что собралось вместе с базовым образом
          # и системными пакетами.
          TARGETS: ${{ inputs.targets || 'gateway worker bot notifier writer cvdmirror feedbackbot' }}
        run: sh deploy/dd-push.sh $TARGETS

      - name: Приложить отчёты к разбору
        # Только при сбое. На успешном прогоне всё уже в DefectDojo, а
        # артефакт с полным SBOM и деревом зависимостей доступен каждому, у
        # кого есть доступ к репозиторию, и живёт дольше, чем нужно.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: .security-reports/
          retention-days: 7
          if-no-files-found: ignore
