# Проверки кода. Вся работа — в общем пайплайне
# (github.com/dato-dev/DevSecOpsCommonPipeline), здесь только вызов.
#
# Что он закрывает: SAST (bandit, semgrep), зависимости (osv-scanner,
# trivy fs), секреты (gitleaks по всей истории), IaC (checkov), Dockerfile
# (hadolint), SBOM. Что он НЕ закрывает и закрывать не должен — проверку
# опубликованных образов по тегу: это другой предмет, и он живёт в
# `images.yml` вместе с заливкой шести образов в DefectDojo.
#
# Почему общий, а не свой. Свой был, и он работал. Но набор правил детекта —
# то, что стареет само: gitleaks и semgrep обновляют сигнатуры чаще, чем мы
# правим конвейер, и «мы это проверяем» незаметно превращается в «мы это
# проверяли». Общий пайплайн обновляется в одном месте на все репозитории.

name: security

on:
  pull_request:
    # Гейт имеет смысл ДО слияния, иначе он сообщает о том, что уже в main.
    #
    # На своём раннере `pull_request` обычно запрещён — он означает выполнение
    # кода из чужого форка на вашем железе. Здесь это допустимо по одной
    # причине: репозиторий приватный, и открыть PR может только тот, у кого
    # уже есть доступ к коду. Станет публичным — этот триггер надо убрать
    # первым, до того как появится первый внешний PR.

  push:
    branches: [main]
    # Фильтра по путям ЗДЕСЬ БЫТЬ НЕ ДОЛЖНО. Соблазн понятный — не гонять
    # проверку на правку README, — но одна из целей прогона это gitleaks, а
    # секрет попадает в репозиторий каким угодно файлом: примером конфигурации,
    # вставкой в документацию, дампом в комментарии. Список путей означал бы,
    # что утечку ищут только там, где её и так не ждут, и отказ был бы
    # молчаливым: прогон зелёный, потому что не запускался.

  schedule:
    # Уязвимость в зависимости появляется без единого коммита в проект. Без
    # расписания репозиторий, где месяц не было изменений, месяц считается
    # проверенным.
    - cron: "0 3 * * *"

  workflow_dispatch:

# Права нужны ВЫЗЫВАЮЩЕМУ: вызванный workflow их наследует и сам себе добавить
# не может. Явный блок заменяет набор по умолчанию целиком, а не дополняет,
# поэтому `actions: read` перечислен — без него сборка артефактов прогона
# падает на своих же артефактах с 403.
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: dato-dev/DevSecOpsCommonPipeline/.github/workflows/security.yml@v1
    with:
      # На своём раннере: SEC_RUNS_ON=self-hosted в переменных репозитория.
      # Job'ы идут в `container:`, то есть раннеру нужен доступ к docker.
      runs_on: ${{ vars.SEC_RUNS_ON || 'ubuntu-latest' }}
      langs: python
      # Каталоги с кодом, а не весь репозиторий. `tests` не перечислены
      # намеренно: bandit ругается на каждый `assert`, и сотня находок из
      # тестов заслонила бы десяток из сервисов.
      python_paths: "packages services deploy corpus samples"
      # Порог по умолчанию, выписан явно: значение, от которого зависит, падает
      # ли сборка, не должно жить в чужом файле.
      fail_on: high
      # Линтер сборку не валит: `make lint` уже гоняет ruff по тем же файлам и
      # с настройками проекта. Здесь он нужен как второе мнение в сводке.
      lint_fail_on: none
      dd: "1"
    secrets:
      DD_TOKEN: ${{ secrets.DD_TOKEN }}
      # Секреты в reusable workflow не наследуются — каждый пробрасывается явно.
      DD_CA_CERT: ${{ secrets.DD_CA_CERT }}
