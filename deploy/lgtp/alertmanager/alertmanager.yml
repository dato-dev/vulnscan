global:
  resolve_timeout: 5m
  # smtp_smarthost: "smtp.example.com:587"
  # smtp_from: "alerts@example.com"
  # smtp_auth_username: "alerts@example.com"
  # smtp_auth_password: "secret"

route:
  receiver: default
  group_by: [alertname, job, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Watchdog никуда не шлём (или отправляйте в Dead Man's Snitch)
    - matchers:
        - alertname = "Watchdog"
      receiver: blackhole
      group_wait: 0s
      repeat_interval: 1h

    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 1h

    - matchers:
        - severity = "warning"
      receiver: default

inhibit_rules:
  # Критический алерт глушит warning по тому же объекту
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [alertname, instance]

  # Если таргет лежит — не спамим его метриковыми алертами
  - source_matchers: [alertname = "TargetDown"]
    target_matchers: [severity =~ "warning|critical"]
    equal: [instance]

receivers:
  - name: blackhole

  - name: default
