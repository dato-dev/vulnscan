# freshclam ходит только во внутреннее зеркало.
#
# Прямой доступ к database.clamav.net не нужен и не используется: их CDN
# ограничивает частоту, а в некоторых сетях он попросту недоступен. Наружу за
# базами ходит один контейнер cvdmirror, clamd берёт всё у него.

DatabaseDirectory /var/lib/clamav
DatabaseMirror http://cvdmirror:8000

# Проверка версии через TXT-запись здесь не нужна: её делает зеркало, а у нас
# внутри сети её было бы некому обслужить.
DNSDatabaseInfo no

# Инкрементальные патчи выключены: во внутренней сети трафик бесплатный, а
# полный файл исключает целый класс ошибок со сборкой базы из кусков.
ScriptedUpdates no

# Раз в час. Дешёво: зеркало рядом, и это не нагружает чужой CDN.
Checks 24

LogTime yes
LogVerbose no
Foreground yes
