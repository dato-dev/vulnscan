# Публикация gateway наружу — нужна для виджета (M12).
#
#   docker compose -f docker-compose.yml -f docker-compose.widget.yml up -d
#
# Зачем отдельным файлом, а не строкой в основном compose. В обычной установке
# gateway наружу не смотрит: его вызывает бот из внутренней сети, и открытый
# порт был бы лишней поверхностью. Виджет меняет картину — фрейм грузится
# браузером посетителя, и до сканера этот браузер должен дотянуться сам.
#
# Это осознанный шаг, а не деталь настройки, поэтому он и оформлен файлом,
# который надо подключить руками.
#
# ОБЯЗАТЕЛЬНО при этом: REQUIRE_SIGNATURE=true. Наружу смотрит ручка приёма
# файлов; без подписи грузить сможет кто угодно, а тенант возьмётся из
# умолчания.
#
# Для боевой установки вместо этого файла берите профиль `public`: там Caddy
# с TLS. Открытый HTTP годится для стенда в локальной сети и только — по нему
# пойдут и документ, и обезвреженная копия.

services:
  gateway:
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      # Публикация порта не работает в сети с `internal: true`, причём молча:
      # `ports` в файле есть, отображения нет. На эти грабли мы уже наступали
      # с демо-сайтом.
      egress:
