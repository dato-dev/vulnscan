# Состояние: очередь, история, объектное хранилище.
#
# Всё едет в кластер (M11.8). Половина системы снаружи означала бы две
# операционные модели навсегда — это дороже, чем разобраться со StatefulSet.
#
# У каждого свой PVC и ЯВНЫЙ storageClassName. Дефолтный класс молча
# подставляется разный в разных кластерах, а для Redis с AOF разница между
# локальным и сетевым диском — это разница в том, переживёт ли очередь переезд
# пода на другой узел.
#
# `local-path` привязывает том к узлу: под, переехавший на другой узел, своих
# данных не увидит. Для одной реплики это приемлемо и осознанно.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vulnscan
  labels:
    app: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    # Перезапуск при изменении ConfigMap и Secret, на которые ссылается этот
    # объект (Stakater Reloader). Нужен он ровно там, где обновление не
    # доезжает само: секреты, смонтированные через `subPath`, обновлений НЕ
    # получают вовсе, а переменные окружения читаются один раз при старте.
    #
    # ConfigMap с политиками из этого исключён — см. `10-config.yaml`.
    reloader.stakater.com/auto: "true"
  name: redis
  namespace: vulnscan
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid образа redis:alpine. Свой номер, а не 10001: файлы на PVC уже
        # принадлежат ему, и смена пользователя означала бы отказ при старте.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          # Запись на диск включена. Без неё перезапуск терял принятые, но не
          # обработанные задачи: клиент получил `202`, а вердикт не приходил
          # никогда. Группа потребителей восстанавливалась сама, задачи — нет.
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vulnscan
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    # Перезапуск при изменении ConfigMap и Secret, на которые ссылается этот
    # объект (Stakater Reloader). Нужен он ровно там, где обновление не
    # доезжает само: секреты, смонтированные через `subPath`, обновлений НЕ
    # получают вовсе, а переменные окружения читаются один раз при старте.
    #
    # ConfigMap с политиками из этого исключён — см. `10-config.yaml`.
    reloader.stakater.com/auto: "true"
  name: postgres
  namespace: vulnscan
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid образа postgres:alpine — 70, не 999 как в debian-варианте.
        # Меняете базовый образ — проверьте: несовпадение даёт отказ при старте
        # на правах к каталогу данных.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: vulnscan
            - name: POSTGRES_USER
              value: vulnscan
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vulnscan-credentials
                  key: POSTGRES_PASSWORD
            # Данные в подкаталоге тома: local-path отдаёт каталог, в котором
            # может оказаться `lost+found`, и initdb откажется в него писать.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vulnscan
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vulnscan
            periodSeconds: 5
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: vulnscan
  labels:
    app: minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    # Перезапуск при изменении ConfigMap и Secret, на которые ссылается этот
    # объект (Stakater Reloader). Нужен он ровно там, где обновление не
    # доезжает само: секреты, смонтированные через `subPath`, обновлений НЕ
    # получают вовсе, а переменные окружения читаются один раз при старте.
    #
    # ConfigMap с политиками из этого исключён — см. `10-config.yaml`.
    reloader.stakater.com/auto: "true"
  name: minio
  namespace: vulnscan
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: vulnscan-credentials
                  key: S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vulnscan-credentials
                  key: S3_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 32Gi
