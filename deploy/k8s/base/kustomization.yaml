# База — сам сервис: приём, разбор, доставка, хранилища, антивирус.
# Это то, что разворачивает любой, кому нужна проверка файлов.
#
# Файлы пронумерованы в порядке выката — читать их надо в этом же порядке.
# Номера ни на что не влияют технически: kustomize сам раскладывает объекты по
# видам (Namespace раньше ConfigMap, ConfigMap раньше Deployment), и порядок
# строк ниже на результат не действует. Нумерация здесь для человека, который
# разворачивает руками или разбирается, что от чего зависит.
#
# Клиентов (Telegram-бот, демо-форма) здесь нет намеренно: они не части
# сервиса, а примеры подключения. Им место в оверлее `examples` — тому, кто
# разворачивает сервис для своей интеграции, бот не нужен и не должен
# приезжать «за компанию».
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vulnscan

resources:
  # Пространство имён и учётные записи — до всего остального.
  - 00-namespace.yaml
  # Конфигурация. Поды без неё не стартуют: envFrom ссылается на ConfigMap.
  - 10-config.yaml
  # Сетевых политик здесь НЕТ: они вынесены в `deploy/k8s/policies` и
  # применяются отдельным шагом. Политика, которая не пускает нужное, выглядит
  # так же, как сломанный сервис, и разбирать это одновременно с запуском
  # самого сервиса — значит держать в голове две неизвестных сразу.
  #
  # Цена решения названа прямо: до применения политик выход наружу есть у
  # всех, включая воркер. Это временное состояние, а не умолчание.
  # Хранилища: от них зависят все сервисы.
  - 30-storage.yaml
  # Антивирус и зеркало его баз: от них зависит воркер.
  - 40-clamav.yaml
  - 50-gateway.yaml
  - 60-worker.yaml
  - 70-notifier.yaml
  # Внешний вход — последним: маршрут в сервис, которого ещё нет, бессмыслен.
  - 80-httproute.yaml

# secrets.example.yaml в resources НЕ входит: это шаблон со значениями
# «ЗАМЕНИТЕ». Попав в сборку, он перезаписал бы настоящие ключи заглушками при
# первом же `kubectl apply -k` — и сервис отвечал бы `401` на подписанные
# запросы, а выглядело бы это как проблема на стороне клиента.
#
# Секреты создаются отдельно, из тех же файлов, что читает compose:
#   sh deploy/k8s/secrets.sh

# Тег образов задаётся ЗДЕСЬ, одной правкой на все манифесты.
#
# `latest` в кластере — это то же, что `latest` у хранилища состояния: на
# вопрос «что сейчас выкачено» ответа нет. Сервис на него отвечает сам (поле
# `image_tag` в логе при старте), но только если тег осмысленный.
#
# Практическая сторона: с плавающим тегом `kubectl rollout restart` образ НЕ
# перекачивает. Kubernetes качает `latest` заново только потому, что для него
# умолчание `imagePullPolicy` — `Always`; стоит указать `IfNotPresent` явно, и
# узел навсегда останется с той версией, что у него уже есть. Именно поэтому
# `imagePullPolicy` в манифестах не задан: умолчание здесь умнее.
#
# Сменить версию: поставить `newTag` и применить. Поды перезапустятся сами —
# спецификация изменилась.
images:
  - name: dato1/vulnscantg-gateway
    newTag: latest
  - name: dato1/vulnscantg-worker
    newTag: latest
  - name: dato1/vulnscantg-notifier
    newTag: latest
  - name: dato1/vulnscantg-writer
    newTag: latest
  - name: dato1/vulnscantg-cvdmirror
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: vulnscan
