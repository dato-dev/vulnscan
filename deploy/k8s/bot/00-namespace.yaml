# Telegram-бот — ПРИМЕР ПОДКЛЮЧЕНИЯ, а не часть сервиса.
#
# Он такой же интегратор, как форма обратной связи: подписывает запросы своим
# ключом и ходит в gateway снаружи. У вас его может не быть вовсе, зато может
# быть свой клиент, о котором мы ничего не знаем.
#
# Свой namespace — не формальность. Бот единственный, кому нужен выход в
# интернет через прокси; в общем namespace адрес прокси с логином и паролем
# оказался бы рядом с воркером, который разбирает враждебные файлы.
#
# СМЕНИТЬ ИМЯ: здесь и в `kustomization.yaml` (поле `namespace`), плюс в
# `WEBHOOK_URL` ниже. Три места, потому что имя входит в адрес.
apiVersion: v1
kind: Namespace
metadata:
  name: vulnscan-bot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bot
  namespace: vulnscan-bot
automountServiceAccountToken: false
