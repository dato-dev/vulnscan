# Telegram-бот в своём namespace.
#
#   sh deploy/k8s/secrets.sh --bot     # токен, ключ и прокси
#   kubectl apply -k deploy/k8s/bot
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ОТДЕЛЬНЫЙ NAMESPACE ЛОМАЕТ КОЛЛБЭК, если не поправить ключ.              │
# │                                                                          │
# │ Gateway проверяет адрес коллбэка по списку `callback_hosts` ключа —      │
# │ ТОЧНЫМ СОВПАДЕНИЕМ хоста, на приёме файла. Пока бот жил рядом, хватало   │
# │ `"callback_hosts": ["bot"]`. Из другого namespace адрес становится       │
# │ `bot.vulnscan-bot.svc`, и запрос отвергается.                            │
# │                                                                          │
# │ Разбирать это тяжело: сообщение намеренно НЕ называет ожидаемый хост —   │
# │ ответ уходит клиенту, и подсказывать ему состав списка незачем.          │
# │                                                                          │
# │ В `deploy/config/keys.json` у ключа бота должно стать:                   │
# │     "callback_hosts": ["bot.vulnscan-bot.svc"]                           │
# │ и потом `sh deploy/k8s/secrets.sh`, чтобы обновить Secret с ключами.     │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Сменить имя namespace — три места: здесь, `00-namespace.yaml` и `WEBHOOK_URL`
# в `bot-env`. Три, потому что имя входит в адрес.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vulnscan-bot

resources:
  - 00-namespace.yaml
  - 10-config.yaml
  - 20-bot.yaml

# secrets.example.yaml в resources НЕ входит: это шаблон со значениями
# «ЗАМЕНИТЕ». Попав в сборку, он перезаписал бы настоящий токен заглушкой при
# первом же `apply -k`, и бот отвалился бы от Telegram.
#
# Заполненную копию назовите `secrets.yaml` — она уже под `.gitignore`
# (правило `*secret*`), в отличие от произвольного имени.
