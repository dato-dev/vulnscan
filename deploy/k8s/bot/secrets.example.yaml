# ШАБЛОН секретов бота.
#
# ЗАПОЛНЯТЬ НЕ ЗДЕСЬ. Скопируйте рядом под именем `secrets.yaml` — оно уже
# закрыто `.gitignore` (правило `*secret*`), в отличие от произвольного:
#
#   cp deploy/k8s/bot/secrets.example.yaml deploy/k8s/bot/secrets.yaml
#   ${EDITOR:-vi} deploy/k8s/bot/secrets.yaml
#   kubectl apply -f deploy/k8s/bot/secrets.yaml
#
# В сборку (`kustomization.yaml`) ни тот, ни другой не входят: секреты
# применяются отдельно от манифестов, иначе `apply -k` перезаписывал бы
# рабочий токен заглушкой.
#
# Альтернатива, если не хочется держать значения в файле вовсе, — собрать те
# же объекты из `deploy/.env` и `deploy/proxy.env`:
#
#   sh deploy/k8s/secrets.sh --bot
apiVersion: v1
kind: Secret
metadata:
  name: bot-credentials
  namespace: vulnscan-bot
type: Opaque
stringData:
  # Токен бота от @BotFather. В `.env` это TELEGRAM_TOKEN.
  TELEGRAM_TOKEN: ЗАМЕНИТЕ

  # Общий со сканером ключ: им подписываются запросы к `/v1/scan` и им же
  # проверяется подпись входящего коллбэка.
  #
  # ДОЛЖЕН СОВПАДАТЬ со значением `secret` у ключа `KEY_ID` в `keys.json`.
  # Разойдутся — gateway ответит `401`, и выглядеть это будет как проблема
  # доступа, а не как рассинхрон двух файлов.
  HMAC_SECRET: ЗАМЕНИТЕ

  # Идентификатор ключа в `keys.json`. Тенант выводится из ключа, а не из
  # заголовка, поэтому имя здесь определяет, чьи политика и пороги применятся.
  KEY_ID: telegram-bot-1
---
# Прокси для Telegram. СОЗДАВАТЬ ТОЛЬКО ЕСЛИ он нужен: без прокси Secret не
# создавайте вовсе — в манифесте бота он подключён с `optional: true`, и под
# стартует без него.
#
# Схема http:// ДАЖЕ ДЛЯ HTTPS-трафика. Клиент открывает обычное соединение с
# прокси и просит CONNECT; `https://` означало бы TLS до самого прокси, чего
# почти никто не умеет, и попытка кончится таймаутом — без внятной ошибки,
# просто «бот молчит».
#
# NO_PROXY задан в ConfigMap `bot-env`: там нет секрета, а список внутренних
# адресов полезно видеть. Без него запрос к gateway ушёл бы в прокси и не
# вернулся — прокси про сеть кластера ничего не знает.
apiVersion: v1
kind: Secret
metadata:
  name: bot-proxy
  namespace: vulnscan-bot
type: Opaque
stringData:
  HTTP_PROXY: http://ЛОГИН:ПАРОЛЬ@ХОСТ:ПОРТ
  HTTPS_PROXY: http://ЛОГИН:ПАРОЛЬ@ХОСТ:ПОРТ
