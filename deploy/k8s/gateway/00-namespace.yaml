# Gateway живёт отдельно от приложения, и это не бюрократия.
#
# У него внешний адрес и TLS-сертификат — вещи уровня кластера, переживающие
# конкретное приложение. Снесёте namespace `vulnscan` — адрес и сертификат
# останутся, а маршруты пересоздадутся.
#
# Хотите проще — положите Gateway прямо в `vulnscan`. Тогда из `parentRefs` в
# маршруте можно убрать `namespace`, а `allowedRoutes` ниже не понадобится
# вовсе. Цена: при удалении namespace уедет и внешний адрес.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
