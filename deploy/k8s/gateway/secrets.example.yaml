# ШАБЛОН. Настоящие значения сюда не коммитятся — см. deploy/k8s/README.md.
#
# Здесь же закрывается D7. В compose `deploy/config` монтируется воркеру
# ЦЕЛИКОМ, вместе с `keys.json`: секреты тенантов лежат в процессе, который
# разбирает враждебные файлы, и изоляция держится на незаданной переменной
# окружения, а не на правах доступа. В Kubernetes монтируется не каталог, а
# конкретный Secret — и `vulnscan-keys` подключён только к gateway и notifier.
# Воркер получает политику и веса, но не ключи.
#
# Применить из файлов, не редактируя этот шаблон:
#
#   kubectl -n vulnscan create secret generic vulnscan-keys \
#       --from-file=keys.json=deploy/config/keys.json
#   kubectl -n vulnscan create secret generic vulnscan-delivery \
#       --from-file=delivery.json=deploy/secrets/delivery.json
#
# Про права доступа. `defaultMode` у монтирования задан явно и равен 0444.
# Соблазн поставить 0400 («секрет же») ломает сервис: процессы работают под
# uid 10001, владелец файла — root, и чтения не будет. Проявляется это не
# ошибкой доступа, а `degraded` в реестре ключей и `503` на каждой загрузке —
# то есть далеко от причины. Мы это уже проходили на стенде.
apiVersion: v1
kind: Secret
metadata:
  name: vulnscan-keys
  namespace: vulnscan
type: Opaque
stringData:
  keys.json: |
    {
      "ЗАМЕНИТЕ-key-id": {
        "tenant": "ЗАМЕНИТЕ-имя-тенанта",
        "secret": "ЗАМЕНИТЕ-не-меньше-16-символов",
        "callback_hosts": [],
        "disabled": false
      }
    }
---
# Учётные данные приёмников обезвреженных копий (M14.8). Отдельный Secret, а
# не ключ в предыдущем: его читает только notifier. Ключ от чужого хранилища
# в процессе, разбирающем враждебные файлы, — это запись в инфраструктуру
# клиента из дыры в парсере.
apiVersion: v1
kind: Secret
metadata:
  name: vulnscan-delivery
  namespace: vulnscan
type: Opaque
stringData:
  delivery.json: |
    {
      "ЗАМЕНИТЕ-credentials-id": {
        "access_key": "ЗАМЕНИТЕ",
        "secret_key": "ЗАМЕНИТЕ"
      }
    }
---
# Переменные-секреты: доступ к хранилищу и базе.
apiVersion: v1
kind: Secret
metadata:
  name: vulnscan-credentials
  namespace: vulnscan
type: Opaque
stringData:
  S3_ACCESS_KEY: ЗАМЕНИТЕ
  S3_SECRET_KEY: ЗАМЕНИТЕ
  POSTGRES_PASSWORD: ЗАМЕНИТЕ
  POSTGRES_DSN: postgresql://vulnscan:ЗАМЕНИТЕ@postgres.vulnscan.svc:5432/vulnscan
---
# Выход наружу через прокси. Создавать ТОЛЬКО если прямого выхода нет.
#
# Подключён к зеркалу баз, notifier и боту — тем, кому связь наружу нужна по
# назначению. Воркер его не получает: он разбирает враждебные файлы, и адрес
# прокси с логином и паролем в его окружении — лишняя дверь.
#
# Схема http:// ДАЖЕ ДЛЯ HTTPS-трафика. Клиент открывает обычное соединение с
# прокси и просит CONNECT; `https://` означало бы TLS до самого прокси, чего
# почти никто не умеет, и попытка кончится таймаутом.
#
# NO_PROXY задан в ConfigMap `vulnscan-env` — там нет секрета, а список
# внутренних адресов полезно видеть.
apiVersion: v1
kind: Secret
metadata:
  name: vulnscan-proxy
  namespace: vulnscan
type: Opaque
stringData:
  HTTP_PROXY: http://ЛОГИН:ПАРОЛЬ@ХОСТ:ПОРТ
  HTTPS_PROXY: http://ЛОГИН:ПАРОЛЬ@ХОСТ:ПОРТ
