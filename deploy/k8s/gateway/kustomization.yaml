# Внешний вход. Ставится ОТДЕЛЬНО от приложения и обычно один раз:
#
#   kubectl apply -k deploy/k8s/gateway
#
# Отдельно потому, что у Gateway свой жизненный цикл. Внешний адрес и
# сертификат переживают приложение: пересоздать `vulnscan` можно сколько
# угодно раз, адрес при этом меняться не должен.
#
# Если Gateway в кластере УЖЕ ЕСТЬ — не применяйте это, а пропишите
# существующий в `base/80-httproute.yaml`. Второй Gateway означает второй
# внешний адрес и второй сертификат на тот же домен.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-gateway.yaml
