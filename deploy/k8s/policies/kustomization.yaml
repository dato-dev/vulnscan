# Сетевые политики — ОТДЕЛЬНЫЙ ЭТАП.
#
#   kubectl apply -k deploy/k8s/policies      # включить
#   kubectl -n vulnscan delete cnp --all      # снять все
#
# Почему не в базе. Политика, которая не пускает нужное, выглядит так же, как
# сломанный сервис: поды работают, соединения нет, а причина видна только в
# Hubble. Разбираться с этим ОДНОВРЕМЕННО с запуском самого сервиса — значит
# держать в голове две неизвестных сразу; ровно на этом и застрял первый
# выкат. Сначала пусть работает, потом закрывается.
#
# Порядок включения, который себя оправдывает:
#
#   1. Применить политики.
#   2. Включить режим аудита на тех подах, которые сломались:
#      sh deploy/k8s/audit.sh on clamd-0 cvdmirror-0
#   3. Собрать список недостающего:
#      hubble observe --namespace vulnscan --verdict AUDIT --last 100
#   4. Дописать правила, выключить аудит, убедиться, что записей AUDIT нет.
#
# Главное, ради чего всё это: у воркера нет выхода наружу. Остальное —
# уточнения; если время кончилось, оставьте включённой хотя бы политику
# `worker`, она и есть периметр.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vulnscan

resources:
  - network-policies.yaml
