# Ядерная изоляция разбора недоверенных файлов.
#
#   docker compose -f docker-compose.yml -f docker-compose.gvisor.yml up -d
#
# `runsc` — это gVisor: системные вызовы обслуживает пользовательское ядро, а не
# хостовое, и побег из парсера упирается в него, а не в ядро сервера. Требует
# установки (deploy/install-gvisor.sh) и стоит латентности: разбор и пересборка
# PDF замедляются примерно втрое, перекодирование картинки — нет.
#
# Рантайм и адреса заданы здесь ВМЕСТЕ намеренно. Под gVisor не работает
# встроенный DNS Docker: резолвер слушает на 127.0.0.11 в сетевом пространстве
# хоста, а песочница поднимает собственный стек со своим loopback и дотянуться
# туда не может (флаг --reproduce-nat это не лечит — он переносит правила NAT,
# но не самого слушателя). Записи в /etc/hosts читаются раньше DNS, поэтому
# резолвер не нужен вовсе.
#
# Разделить их нельзя: `runsc` без адресов не поднимется вообще, а адреса без
# `runsc` бессмысленны. Один файл — одна согласованная пара.

x-sandbox-hosts: &sandbox-hosts
  - "redis:172.20.0.10"
  - "minio:172.20.0.11"
  - "clamd:172.20.0.12"
  - "bot:172.20.0.13"
  - "cvdmirror:172.20.0.15"

services:
  worker:
    runtime: runsc
    extra_hosts: *sandbox-hosts

  deepscan:
    runtime: runsc
    extra_hosts: *sandbox-hosts
